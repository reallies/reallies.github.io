name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI에는 볼트가 없으므로 동기화 산출물을 커밋해 두고 sync를 건너뛴다.
      # (content/ 를 커밋하려면 .gitignore 에서 해당 3줄을 제거할 것)
      - run: npx astro build
      # PDF를 이 빌드에서 다시 뽑아 dist/ 에 덮어쓴다 — 사이트를 고치면 PDF도 같이 바뀐다.
      # 실패해도 배포는 막지 않는다(커밋된 public/ PDF가 남는다). 대신 경고를 띄운다.
      # 러너에 한글 글꼴이 없으면 고정폭(monospace) 자리의 한글이 □ 로 찍힌다(2026-10-01 실측).
      - name: Install Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk && fc-cache -f
      - name: Regenerate portfolio PDF
        run: node scripts/pdf.mjs --dist || echo "::warning::PDF 재생성 실패 — 커밋된 public/hyunseok-oh-portfolio.pdf 가 배포된다"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
