<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #F2F1ED;
    color: #15181B;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 60px 80px 56px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  .eyebrow { font-size: 19px; letter-spacing: 0.18em; color: #6A7075; }

  h1 { font-size: 92px; line-height: 0.94; letter-spacing: -0.045em; font-weight: 680; margin-top: 22px; }
  .latin { font-size: 26px; letter-spacing: 0.14em; color: #6A7075; font-weight: 500; margin-top: 14px; }
  .thesis { font-size: 33px; line-height: 1.32; font-weight: 640; letter-spacing: -0.025em; margin-top: 28px; max-width: 1000px; word-break: keep-all; }
  .rule { height: 1px; background: #15181B; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .url { font-size: 20px; color: #15181B; letter-spacing: 0.02em; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px; }
  .facts { display: grid; grid-template-columns: auto auto; gap: 16px 48px; flex: none; }
  .fact .k { font-size: 15px; color: #6A7075; letter-spacing: 0.04em; }
  .fact .v { white-space: nowrap; font-size: 21px; font-weight: 640; letter-spacing: -0.015em; margin-top: 3px; }
  /* 우측 하단의 지표 스파크 — 유일한 장식이자 실제 데이터 */
  .spark { display: flex; align-items: flex-end; gap: 10px; flex: none; }
  .spark .cap { font-size: 15px; color: #6A7075; text-align: right; line-height: 1.5; }
  .spark .cap b { white-space: nowrap; display: block; font-size: 20px; color: #B5711C; font-weight: 680; }
</style>
</head>
<body>
  <!-- scripts/og.mjs 가 {{…}} 를 src/data/profile.json · checkmate.md 에서 채운다. 직접 문구를 쓰지 않는다 -->
  <div>
    <div class="top"><div class="eyebrow mono">{{eyebrow}}</div><div class="url mono">{{url}}</div></div>
    <h1>{{name}}</h1>
    <div class="latin mono">{{latin}}</div>
    <div class="thesis">{{thesis}}</div>
  </div>
  <div>
    <div class="rule"></div>
    <div class="bottom">
      <div class="facts">{{facts}}</div>
      <div class="spark">
        <svg width="96" height="46" preserveAspectRatio="none" viewBox="0 0 150 46" aria-hidden="true">
          <polyline points="5,38 145,7" fill="none" stroke="#B5711C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="145" cy="7" r="5.5" fill="#B5711C"/>
        </svg>
        <div class="cap"><b>{{spark}}</b>{{sparkLabel}}</div>
      </div>
    </div>
  </div>
</body>
</html>
