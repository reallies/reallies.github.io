<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">원리 1: 정보와 행동의 관계</title><rect width="640" height="360" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="332" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">원리 1: 정보와 행동의 관계</text><text x="32" y="100" font-size="17">본 작품 기록 → 취향의 요약 / 다음 후보 발견 →</text><text x="32" y="131" font-size="17">작품 상세 → 감상 경로</text></g></svg>