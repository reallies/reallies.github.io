<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title"><title id="title">조건에 따른 정보 구조</title><rect width="640" height="280" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="252" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">조건에 따른 정보 구조</text><text x="32" y="100" font-size="17">감상 기록과 후보 선택 → 평가·추천 목록 분리</text><text x="32" y="139" font-size="17">집계·예측·사용자 기록 → 평균·예상·내 평가 라벨</text><text x="32" y="178" font-size="17">평가 빈도와 오입력 비용 → 상세·메뉴·카드 비교</text><text x="32" y="217" font-size="17">취향과 접근 조건 → 추천 정보·제공처 구분</text></g></svg>