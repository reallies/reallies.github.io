<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" aria-labelledby="title"><title id="title">관찰에서 읽은 네 가지 원리</title><rect width="640" height="486" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="458" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">관찰에서 읽은 네 가지 원리</text><text x="32" y="100" font-size="17">1. 평가 목록은 본 작품을 기록하는 데, 추천 목록은</text><text x="32" y="131" font-size="17">다음 후보를 고르는 데 필요한 정보를 앞에 둔다.</text><text x="32" y="170" font-size="17">2. 평균은 집계, 예상은 개인화 예측, 내 평가는</text><text x="32" y="201" font-size="17">사용자의 기록이다. 같은 별 기호라도 출처가 다르다.</text><text x="32" y="240" font-size="17">3. 평가 진입은 상세·메뉴·카드 직접 입력을</text><text x="32" y="271" font-size="17">비교한다. 가상 메뉴안과 현행 상세 경로는 별 선택까지</text><text x="32" y="302" font-size="17">각각2회 입력이다.</text><text x="32" y="341" font-size="17">4. 예상 별점과 감상 가능한 곳은 취향과 접근 조건을</text><text x="32" y="372" font-size="17">각각 알려준다. 제공처 배지만으로 재생 가능 여부를 알</text><text x="32" y="403" font-size="17">수는 없다.</text></g></svg>