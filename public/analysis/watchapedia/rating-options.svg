<svg data-layout="spatial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="rtitle rdesc"><title id="rtitle">별 선택까지의 경로 비교: 상세 2회·메뉴 2회·카드 1회</title><desc id="rdesc">각 경로는 실제 제출 실험의 측정치가 아니다. 메뉴안은 메뉴 안에서 별을 직접 고르며 별도 입력창을 열지 않는다. 저장과 제출 후 상태는 비교에서 제외한 정적 설계도다.</desc><rect width="1040" height="690" rx="10" fill="#f4f5f1"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#18313c"><text x="24" y="37" font-size="23" fill="#18313c" font-weight="700">비교 도식 / 같은 작품에 별 하나 고르기</text><text x="24" y="66" font-size="16" fill="#5c7078" font-weight="400">시작: 추천 카드가 보이는 상태  ·  종료: 별 선택  ·  저장과 제출 완료는 제외</text><rect x="24" y="91" width="308" height="511" rx="8" fill="#fff" stroke="#cad7db"/><text x="40" y="124" font-size="21" fill="#18313c" font-weight="700">A  현행 상세 경로</text><text x="40" y="152" font-size="17" fill="#21647b" font-weight="700">경로상 2회</text><rect x="366" y="91" width="308" height="511" rx="8" fill="#fff" stroke="#cad7db"/><text x="382" y="124" font-size="21" fill="#18313c" font-weight="700">B  메뉴 안에 별</text><text x="382" y="152" font-size="17" fill="#21647b" font-weight="700">가정상 2회</text><rect x="708" y="91" width="308" height="511" rx="8" fill="#fff" stroke="#cad7db"/><text x="724" y="124" font-size="21" fill="#18313c" font-weight="700">C  카드 안에 별</text><text x="724" y="152" font-size="17" fill="#21647b" font-weight="700">가정상 1회</text><rect x="40" y="176" width="276" height="75" rx="8" fill="#edf2f3" stroke="#cad7db"/><text x="54" y="207" font-size="18" fill="#18313c" font-weight="600">가상 작품 카드</text><text x="54" y="234" font-size="16" fill="#21647b" font-weight="400">① 카드 열기 →</text><path d="M178 262v25m-5-5 5 5 5-5" fill="none" stroke="#21647b" stroke-width="2"/><rect x="40" y="299" width="276" height="137" rx="8" fill="#fff" stroke="#cad7db"/><text x="54" y="329" font-size="17" fill="#18313c" font-weight="600">작품 상세 · 정보 확인</text><text x="54" y="373" font-size="28" fill="#21647b" font-weight="400">☆ ☆ ☆ ☆ ☆</text><text x="54" y="410" font-size="16" fill="#21647b" font-weight="400">② 상세에서 별 선택</text><text x="40" y="477" font-size="17" fill="#18313c" font-weight="600">작품 정보와 함께 평가</text><text x="40" y="509" font-size="16" fill="#5c7078" font-weight="400">목록에서 상세로 이동</text><text x="40" y="541" font-size="16" fill="#5c7078" font-weight="400">복귀 상태는 추가 확인</text><rect x="382" y="176" width="276" height="75" rx="8" fill="#edf2f3" stroke="#cad7db"/><text x="396" y="207" font-size="18" fill="#18313c" font-weight="600">가상 작품 카드</text><text x="396" y="234" font-size="16" fill="#21647b" font-weight="400">① 더보기 열기  ⋮</text><path d="M520 262v25m-5-5 5 5 5-5" fill="none" stroke="#21647b" stroke-width="2"/><rect x="382" y="299" width="276" height="137" rx="8" fill="#e8f3f6" stroke="#21647b"/><text x="396" y="329" font-size="17" fill="#18313c" font-weight="600">펼친 메뉴 안의 입력</text><text x="396" y="373" font-size="28" fill="#21647b" font-weight="400">☆ ☆ ☆ ☆ ☆</text><text x="396" y="410" font-size="16" fill="#21647b" font-weight="400">② 메뉴에서 별 선택</text><text x="382" y="477" font-size="17" fill="#18313c" font-weight="600">목록 맥락 유지 가설</text><text x="382" y="509" font-size="16" fill="#5c7078" font-weight="400">메뉴 속 별을 찾는지 확인</text><text x="382" y="541" font-size="15" fill="#5c7078" font-weight="400">별도 평가창을 여는 안은 아님</text><rect x="724" y="176" width="276" height="260" rx="8" fill="#edf2f3" stroke="#cad7db"/><text x="738" y="207" font-size="18" fill="#18313c" font-weight="600">가상 작품 카드</text><rect x="738" y="222" width="248" height="70" rx="8" fill="#dfe8eb" stroke="#dfe8eb"/><text x="800" y="265" font-size="16" fill="#5c7078" font-weight="400">작품 이미지</text><text x="738" y="349" font-size="28" fill="#21647b" font-weight="400">☆ ☆ ☆ ☆ ☆</text><text x="738" y="390" font-size="16" fill="#21647b" font-weight="400">① 카드에서 별 선택</text><text x="724" y="477" font-size="17" fill="#18313c" font-weight="600">입력이 바로 보임</text><text x="724" y="509" font-size="16" fill="#5c7078" font-weight="400">오입력·탐색 간섭 확인</text><text x="724" y="541" font-size="14" fill="#5c7078" font-weight="400">한 번이라는 이유만으로 채택 안 함</text><text x="24" y="637" font-size="18" fill="#21647b" font-weight="700">수요가 확인되지 않으면 A 유지도 가능</text><text x="24" y="666" font-size="15" fill="#5c7078" font-weight="400">표시한 횟수는 경로를 풀어 센 값이며, 실제 저장·완료 실험 결과가 아닙니다.</text></g></svg>