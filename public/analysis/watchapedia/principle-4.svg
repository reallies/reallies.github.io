<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 181" role="img" aria-labelledby="title"><title id="title">원리 4: 정보와 행동의 관계</title><rect width="640" height="181" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="153" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">원리 4: 정보와 행동의 관계</text><text x="32" y="100" font-size="17">취향 후보 → 제공처·이용 방식 확인 → 외부 플랫폼</text><text x="32" y="131" font-size="17">→ 계정별 조건 확인 → 감상</text></g></svg>