<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">원리 3: 정보와 행동의 관계</title><rect width="640" height="220" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="192" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">원리 3: 정보와 행동의 관계</text><text x="32" y="100" font-size="17">현행 관찰: 추천 카드 → 상세 → 별 선택</text><text x="32" y="139" font-size="17">대안 가정: 카드 메뉴 → 별 선택 / 카드 안의 별</text><text x="32" y="170" font-size="17">선택</text></g></svg>