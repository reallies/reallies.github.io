<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">원리 4: 정보와 행동의 관계</title><rect width="640" height="360" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="332" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">원리 4: 정보와 행동의 관계</text><text x="32" y="100" font-size="17">선결제 → 수강·조건 이행 → 증빙/기한 내 신청 →</text><text x="32" y="131" font-size="17">조건 심사 → 공제 후 환급</text></g></svg>