<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 455" role="img" aria-labelledby="title"><title id="title">관찰에서 읽은 네 가지 원리</title><rect width="640" height="455" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="427" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">관찰에서 읽은 네 가지 원리</text><text x="32" y="100" font-size="17">1. 문항의 정오 확인과 틀린 이유를 이해하는 과업을</text><text x="32" y="131" font-size="17">나눠, 결과와 해설의 연결을 살폈다.</text><text x="32" y="170" font-size="17">2. RC Part5/6 23문항의 결과와 사용자가</text><text x="32" y="201" font-size="17">입력한 목표를 구분했다. 전체 TOEIC 점수로 환산할</text><text x="32" y="232" font-size="17">근거는 확인하지 못했다.</text><text x="32" y="271" font-size="17">3. 교재 상세는 MP3·해설·강의를 모으고, MP3</text><text x="32" y="302" font-size="17">상세는 판본과 쇄·가격을 표시한다.</text><text x="32" y="341" font-size="17">4. 환급 상품은 지금 내는 금액과 조건 달성 후 받는</text><text x="32" y="372" font-size="17">금액, 공제와 신청 기한을 함께 읽어야 한다.</text></g></svg>