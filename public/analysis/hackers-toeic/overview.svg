<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title"><title id="title">조건에 따른 정보 구조</title><rect width="640" height="280" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="252" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">조건에 따른 정보 구조</text><text x="32" y="100" font-size="17">문항별 정오 확인 → 해당 해설·결과 복귀</text><text x="32" y="139" font-size="17">RC 일부 영역만 측정 → 결과와 자기보고 목표 구분</text><text x="32" y="178" font-size="17">판·쇄별 자료 차이 → 교재 식별·자료 허브</text><text x="32" y="217" font-size="17">조건부 환급 → 선결제·조건·제외 비용·기한</text></g></svg>