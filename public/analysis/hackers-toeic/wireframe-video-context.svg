<svg data-layout="spatial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="v-title v-desc"><title id="v-title">기존 영상 옆에 선택 문항과 답을 표시하는 정적 적용안</title><desc id="v-desc">왼쪽 문항 선택과 같은 문항 번호가 영상 위에 표시된다. 문항별 재생 위치 자동 이동은 포함하지 않는다.</desc><rect width="1040" height="650" rx="12" fill="#f4f5f1"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#18313c"><text x="24" y="36" font-size="22" fill="#18313c" font-weight="700">설계 예시  /  같은 회차·문항을 영상 옆에서 확인</text><text x="24" y="65" font-size="16" fill="#5c7078" font-weight="400">기존 회차 영상 유지 · 문항별 자동 재생 이동은 제외</text><rect x="24" y="88" width="278" height="450" rx="8" fill="#fff" stroke="#cbd7dc"/><rect x="330" y="88" width="686" height="450" rx="8" fill="#fff" stroke="#cbd7dc"/><text x="44" y="122" font-size="19" fill="#18313c" font-weight="700">이번 회차의 문항</text><text x="44" y="149" font-size="14" fill="#5c7078" font-weight="400">번호·답안은 배치 설명용 예시</text><rect x="40" y="174" width="246" height="56" rx="8" fill="#e8f3f6" stroke="#21647b"/><text x="54" y="208" font-size="18" fill="#18313c" font-weight="600">문항 101</text><text x="232" y="208" font-size="15" fill="#a14439" font-weight="400">오답</text><rect x="40" y="244" width="246" height="56" rx="8" fill="#fff" stroke="#cbd7dc"/><text x="54" y="278" font-size="18" fill="#18313c" font-weight="600">문항 102</text><text x="232" y="278" font-size="15" fill="#326d57" font-weight="400">정답</text><rect x="40" y="314" width="246" height="56" rx="8" fill="#fff" stroke="#cbd7dc"/><text x="54" y="348" font-size="18" fill="#18313c" font-weight="600">문항 103</text><text x="232" y="348" font-size="15" fill="#a14439" font-weight="400">오답</text><text x="44" y="412" font-size="16" fill="#21647b" font-weight="700">선택 문항 101</text><text x="44" y="444" font-size="18" fill="#18313c" font-weight="400">내 답 A  /  정답 D</text><text x="44" y="503" font-size="13" fill="#5c7078" font-weight="400">나머지 문항은 생략한 정적 예시</text><text x="350" y="121" font-size="20" fill="#18313c" font-weight="700">회차명 · RC 연습 해설</text><text x="350" y="151" font-size="17" fill="#21647b" font-weight="600">현재 확인 중: 문항 101  /  내 답 A  /  정답 D</text><rect x="350" y="173" width="646" height="240" rx="8" fill="#e9eef0" stroke="#b6c6cd"/><path d="M650 245L650 307L700 276Z" fill="#21647b"/><text x="530" y="345" font-size="20" fill="#18313c" font-weight="600">기존 회차 해설 영상</text><text x="526" y="376" font-size="15" fill="#5c7078" font-weight="400">플레이어 연결 전 자리 표시</text><text x="350" y="444" font-size="16" fill="#18313c" font-weight="400">문항 번호를 눌러도 재생 위치는 바뀌지 않습니다.</text><rect x="350" y="473" width="170" height="43" rx="8" fill="#21647b" stroke="#21647b"/><text x="370" y="501" font-size="16" fill="#fff" font-weight="600">← 결과 목록으로</text><text x="548" y="500" font-size="15" fill="#5c7078" font-weight="400">같은 문항이 선택된 상태로 복귀하도록 설계</text><text x="24" y="577" font-size="16" fill="#18313c" font-weight="700">이 안이 다루는 것</text><text x="206" y="577" font-size="17" fill="#21647b" font-weight="400">회차·선택 문항·답안의 맥락 유지</text><text x="24" y="613" font-size="16" fill="#18313c" font-weight="700">아직 남는 것</text><text x="206" y="613" font-size="17" fill="#5c7078" font-weight="400">영상에서 해당 문항의 설명을 찾는 일 · 재생 시점 데이터 필요</text></g></svg>