<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 181" role="img" aria-labelledby="title"><title id="title">원리 3: 정보와 행동의 관계</title><rect width="640" height="181" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="153" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">원리 3: 정보와 행동의 관계</text><text x="32" y="100" font-size="17">보유 교재 식별 → 판본/쇄 확인 → 자료 종류 →</text><text x="32" y="131" font-size="17">무료/유료·취득 조건 → 대상 자료</text></g></svg>