<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="title"><title id="title">가상 화면 3</title><rect width="640" height="384" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="356" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">가상 화면 3</text><text x="32" y="100" font-size="17">선택한 상품 (가상 예시: 실제 판매 상품 아님)</text><text x="32" y="139" font-size="17">지금 결제할 금액       [상품 데이터 필요]</text><text x="32" y="178" font-size="17">포함 강의/교재          [대상과 판본]</text><text x="32" y="217" font-size="17">조건 달성 시 환급       [적용 조건 확인]</text><text x="32" y="256" font-size="17">제외되는 비용          [상품 데이터 필요]</text><text x="32" y="295" font-size="17">필수 행동 / 신청 기한   [규정 원문]</text><text x="32" y="334" font-size="17">[조건 전체 읽기] [학습 목록으로 돌아가기]</text></g></svg>