<svg data-layout="spatial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc"><title id="title">결과 목록에서 선택한 오답의 해설을 확인하는 설계 예시</title><desc id="desc">왼쪽의 오답 2번이 선택되면 오른쪽에 같은 문항과 선택 답, 정답, 해설이 나타난다. 다음 오답 버튼으로 이동하며 선택 표시도 함께 바뀐다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#21647b" stroke-width="1.5"/></marker></defs><rect width="1040" height="640" rx="12" fill="#f4f5f1"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#18313c"><text x="28" y="38" font-size="22" font-weight="700" fill="#18313c">설계 예시  /  RC 연습 결과와 문항 해설</text><text x="28" y="66" font-size="16" font-weight="400" fill="#5c7078">결과에서 고른 문항을 같은 화면에서 확인합니다.</text><rect x="24" y="90" width="300" height="486" rx="8" fill="#fff" stroke="#d3dcdf"/><rect x="362" y="90" width="654" height="486" rx="8" fill="#fff" stroke="#d3dcdf"/><text x="44" y="124" font-size="20" font-weight="700" fill="#18313c">01  이번 연습 결과</text><text x="44" y="151" font-size="15" font-weight="400" fill="#5c7078">3문항 중 1문항 정답 · 오답 2개</text><rect x="40" y="178" width="268" height="60" rx="8" fill="#fff" stroke="#d3dcdf"/><text x="54" y="204" font-size="17" font-weight="700" fill="#18313c">문항 01</text><text x="54" y="225" font-size="13" font-weight="400" fill="#5c7078">문항 해설 확인</text><text x="240" y="214" font-size="16" font-weight="400" fill="#326d57">정답</text><rect x="40" y="250" width="268" height="60" rx="8" fill="#e8f3f6" stroke="#21647b"/><text x="54" y="276" font-size="17" font-weight="700" fill="#18313c">문항 02</text><text x="54" y="297" font-size="13" font-weight="400" fill="#5c7078">동사 형태</text><text x="240" y="286" font-size="16" font-weight="400" fill="#a14439">오답</text><rect x="40" y="322" width="268" height="60" rx="8" fill="#fff" stroke="#d3dcdf"/><text x="54" y="348" font-size="17" font-weight="700" fill="#18313c">문항 03</text><text x="54" y="369" font-size="13" font-weight="400" fill="#5c7078">문항 해설 확인</text><text x="240" y="358" font-size="16" font-weight="400" fill="#a14439">오답</text><text x="46" y="426" font-size="15" font-weight="700" fill="#21647b">문항 02 선택 중</text><text x="46" y="452" font-size="15" font-weight="400" fill="#5c7078">선택한 문항의 해설이</text><text x="46" y="476" font-size="15" font-weight="400" fill="#5c7078">오른쪽에 표시됩니다.</text><text x="46" y="548" font-size="12" font-weight="400" fill="#5c7078">이번 연습 결과이며 토익 환산 점수가 아닙니다.</text><path d="M311 280H350" stroke="#21647b" stroke-width="2" marker-end="url(#arrow)"/><text x="386" y="124" font-size="20" font-weight="700" fill="#18313c">02  선택한 문항 해설</text><text x="856" y="124" font-size="15" font-weight="700" fill="#21647b">문항 02 / 03</text><text x="386" y="164" font-size="14" font-weight="400" fill="#5c7078">동사 형태 · 아래 문항은 구조 설명용 예시입니다</text><text x="386" y="205" font-size="23" font-weight="600" fill="#18313c">The report must be ___ by Friday.</text><rect x="386" y="228" width="294" height="66" rx="8" fill="#fff4f1" stroke="#e0b5ad"/><text x="402" y="252" font-size="13" font-weight="400" fill="#a14439">내가 고른 답</text><text x="402" y="277" font-size="20" font-weight="600" fill="#a14439">B. submitting</text><rect x="694" y="228" width="298" height="66" rx="8" fill="#edf5ef" stroke="#b3cfbd"/><text x="710" y="252" font-size="13" font-weight="400" fill="#326d57">정답</text><text x="710" y="277" font-size="20" font-weight="600" fill="#326d57">C. submitted</text><text x="386" y="332" font-size="18" font-weight="700" fill="#18313c">왜 틀렸을까?</text><text x="386" y="364" font-size="17" font-weight="400" fill="#18313c">보고서는 제출되는 대상이므로 수동태가 필요합니다.</text><text x="386" y="393" font-size="17" font-weight="400" fill="#18313c">must be 뒤에는 과거분사 submitted가 들어갑니다.</text><path d="M386 421H990" stroke="#d3dcdf"/><text x="386" y="451" font-size="14" font-weight="400" fill="#5c7078">기억할 표현</text><text x="386" y="479" font-size="19" font-weight="600" fill="#18313c">must be + 과거분사  →  ~되어야 한다</text><rect x="386" y="508" width="150" height="44" rx="8" fill="#21647b" stroke="#21647b"/><text x="406" y="536" font-size="16" font-weight="600" fill="#fff">다음 오답 보기 →</text><text x="558" y="536" font-size="16" font-weight="400" fill="#21647b">결과만 보기</text><text x="28" y="609" font-size="17" font-weight="600" fill="#21647b">문항 선택 → 문제·답·해설 확인 → 다음 오답으로 이동</text></g></svg>