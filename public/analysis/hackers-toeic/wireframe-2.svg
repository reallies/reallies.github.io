<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="title"><title id="title">가상 화면 2</title><rect width="640" height="384" fill="#f4f5f1"/><rect x="14" y="14" width="612" height="356" rx="8" fill="white" stroke="#becbcd"/><g font-family="sans-serif" fill="#18313c"><text x="32" y="56" font-size="22" font-weight="bold">가상 화면 2</text><text x="32" y="100" font-size="17">이번 연습에서 이어가기</text><text x="32" y="139" font-size="17">[틀린 문항 다시 풀기]  무료</text><text x="32" y="178" font-size="17">[주제별 연습 찾아보기]  무료/유료 표기</text><text x="32" y="217" font-size="17">내 목표로 탐색하기 (선택)</text><text x="32" y="256" font-size="17">목표 [직접 선택]  ← 진단 결과가 아닙니다</text><text x="32" y="295" font-size="17">[목표에 맞는 학습 목록 탐색]</text><text x="32" y="334" font-size="17">실력 진단이 필요하신가요? [범위·소요시간 확인]</text></g></svg>